[package]
name = "mouser-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
mouser-core.workspace = true
mouser-hidpp.workspace = true
mouser-win.workspace = true
serde_json.workspace = true
windows-sys = { workspace = true, features = ["Win32_Security_Authorization", "Win32_System_SystemInformation", "Win32_UI_HiDpi"] }

[[bin]]
name = "mouser-agent"
path = "src/main.rs"
