[package]
name = "mouser-win"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Authorization", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation"] }
mouser-core.workspace = true
# PNG deflate only (already in the lockfile via the GUI's image stack); stored blocks made 4K shots ~25 MB.
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
