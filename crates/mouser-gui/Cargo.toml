[package]
name = "mouser-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "mouser-gui"
path = "src/main.rs"

[dependencies]
mouser-core.workspace = true
mouser-win.workspace = true
serde_json.workspace = true
windows-sys = { workspace = true, features = ["Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_Storage_Xps", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Time"] }
png = "0.17"
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-software", "software-renderer-systemfonts", "compat-1-2"] }

[build-dependencies]
slint-build = "1.18"
serde_json = "1"
