[workspace]
resolver = "3"
members = ["crates/mouser-core", "crates/mouser-hidpp", "crates/mouser-win", "crates/mouser-agent", "crates/mouser-gui"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mouser-core = { path = "crates/mouser-core" }
mouser-hidpp = { path = "crates/mouser-hidpp" }
mouser-win = { path = "crates/mouser-win" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Threading",
  "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Power",
  "Win32_System_RemoteDesktop", "Win32_System_Pipes", "Win32_Storage_FileSystem",
  "Win32_System_IO", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus",
  "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice",
  "Win32_System_Console", "Win32_UI_Accessibility",
] }

# Small, leak-free resident agent: abort on panic, no unwinding tables.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# MSVC keeps debug info in a separate PDB; archive it per release (audit spec §17.1).
debug = "line-tables-only"
